# Full stack behind nginx. Open http://admin.localhost (super-admin) or http://<slug>.localhost (tenants).
# *.localhost resolves to 127.0.0.1 in Chrome/Firefox/Edge; for other tools add hosts entries or use lvh.me.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: boilerplate
      POSTGRES_USER: boilerplate
      POSTGRES_PASSWORD: ${DB_PASSWORD:-boilerplate}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]          # remove in production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boilerplate"]
      interval: 5s
      retries: 10

  mailpit:                         # catches all outgoing mail: http://localhost:8025
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]

  backend:
    build: ./backend
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/boilerplate
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    depends_on:
      postgres: { condition: service_healthy }
    # not published: only reachable through nginx / the frontend's SSR calls

  frontend:
    build: ./frontend
    environment:
      NUXT_API_INTERNAL_BASE: http://backend:8080/api
      NUXT_PUBLIC_APP_NAME: ${APP_PRODUCT_NAME:-Boilerplate}
    depends_on: [backend]

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["80:80"]
    depends_on: [backend, frontend]

volumes:
  pgdata:
