plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.polygis'
version = '0.1.0-SNAPSHOT'
description = 'Multi-tenant (schema-per-tenant) Spring Boot starter'

java {
    toolchain {
        // 17 is the floor; bump to 21 to enable virtual threads (spring.threads.virtual.enabled=true)
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    springdocVersion = '2.8.9'
}

dependencies {
    // Web / views
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Persistence
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.postgresql:postgresql' // compile scope: LISTEN/NOTIFY uses the PGConnection API

    // Security
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    // Mail
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // Passkeys (WebAuthn): verification only; ceremonies and storage are ours (stateless, per-tenant schema)
    implementation 'com.webauthn4j:webauthn4j-core:0.30.3.RELEASE'

    // Error reporting. Inactive unless SENTRY_DSN is set.
    implementation 'io.sentry:sentry-spring-boot-starter-jakarta:8.61.1'
    implementation 'io.sentry:sentry-logback:8.61.1'

    // API docs
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    // Real PostgreSQL for integration tests without Docker (binaries are downloaded as Maven artifacts)
    testImplementation enforcedPlatform('io.zonky.test.postgres:embedded-postgres-binaries-bom:16.6.0')
    testImplementation 'io.zonky.test:embedded-postgres:2.1.0'
    testRuntimeOnly 'io.zonky.test.postgres:embedded-postgres-binaries-darwin-arm64v8'
    testRuntimeOnly 'io.zonky.test.postgres:embedded-postgres-binaries-linux-arm64v8'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
    testImplementation 'com.webauthn4j:webauthn4j-test:0.32.0.RELEASE' // software authenticator for tests
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-parameters'
}

// `./gradlew bootRun` is for local development: use the dev profile unless told otherwise
tasks.named('bootRun') {
    systemProperty 'spring.profiles.active', System.getProperty('spring.profiles.active', 'dev')
}

tasks.named('test') {
    useJUnitPlatform()
}

// Only the fat jar is needed in the Docker image
tasks.named('jar') {
    enabled = false
}
