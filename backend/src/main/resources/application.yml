spring:
  application:
    name: boilerplate-backend
  # No default profile on purpose: a jar started without SPRING_PROFILES_ACTIVE runs with the safe base
  # settings below (no secrets, no header fallback). `./gradlew bootRun` activates `dev` for you.

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/boilerplate}
    username: ${DB_USER:boilerplate}
    password: ${DB_PASSWORD:boilerplate}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      # every connection is re-pointed per tenant by SchemaMultiTenantConnectionProvider
      connection-init-sql: SET search_path TO public

  jpa:
    open-in-view: false            # tenant is resolved per request; never leak sessions into views
    hibernate:
      ddl-auto: none               # schema is owned by Flyway (public + per-tenant)
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 50

  data:
    web:
      pageable:
        max-page-size: 100        # Spring's default (2000) is a cheap way to load the database

  flyway:
    enabled: false                 # we drive Flyway ourselves: see TenantSchemaMigrator

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    cache: true

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:change-me}
            client-secret: ${GOOGLE_CLIENT_SECRET:change-me}
            scope: openid,email,profile
            redirect-uri: ${OAUTH2_REDIRECT_BASE:{baseUrl}}/api/login/oauth2/code/{registrationId}
          github:
            client-id: ${GITHUB_CLIENT_ID:change-me}
            client-secret: ${GITHUB_CLIENT_SECRET:change-me}
            scope: read:user,user:email
            redirect-uri: ${OAUTH2_REDIRECT_BASE:{baseUrl}}/api/login/oauth2/code/{registrationId}

server:
  port: ${PORT:8080}
  # X-Forwarded-* (host, proto, client IP) are honoured ONLY from trusted proxies, so a client reaching the
  # backend directly cannot pick a tenant host or fake its IP for rate limiting.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # Java regex of proxy addresses. Default: loopback + private networks (docker, k8s, VPC).
      internal-proxies: ${TRUSTED_PROXIES:127\.\d{1,3}\.\d{1,3}\.\d{1,3}|10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2[0-9]|3[0-1])\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1}
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto
      host-header: X-Forwarded-Host
      port-header: X-Forwarded-Port
  error:
    include-message: never        # never leak exception text; API errors are RFC 7807 bodies anyway
    include-stacktrace: never

# Every log line carries [requestId,tenant,user]; the id is also returned as X-Request-Id
logging:
  pattern:
    level: "%5p [%X{requestId:-},%X{tenant:-},%X{user:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/docs/ui

app:
  tenancy:
    # tenant = <slug>.<base-domain>  (e.g. acme.example.com)  OR a custom domain stored on the tenant row
    base-domain: ${APP_BASE_DOMAIN:example.com}
    platform-tenant: platform
    platform-domain: ${APP_PLATFORM_DOMAIN:admin.example.com}
    tenant-header: X-Tenant-ID
    # Propagate tenant changes to all nodes instantly via PostgreSQL LISTEN/NOTIFY
    registry-notify: true
    # Tenant schemas migrated concurrently at startup (keep below the DB pool size)
    migration-parallelism: ${TENANT_MIGRATION_PARALLELISM:4}
    # Only for local development without wildcard DNS: lets anonymous callers pick a tenant via header
    dev-header-fallback: false
    reserved-slugs: [www, api, admin, app, mail, static, public, platform]

  security:
    # AES-256 key for secrets stored in the database (TOTP seeds). openssl rand -base64 32
    # Falls back to a key derived from JWT_SECRET when empty.
    encryption-key: ${APP_ENCRYPTION_KEY:}
    jwt:
      issuer: ${JWT_ISSUER:boilerplate}
      # HS256 (shared secret) or RS256 (key pair; public key served at /api/auth/jwks.json)
      algorithm: ${JWT_ALGORITHM:HS256}
      # RS256 only: RSA private key, PKCS#8 PEM. openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048
      private-key: ${JWT_PRIVATE_KEY:}
      # >= 32 bytes. Signs HS256 tokens and (in both modes) the OAuth2 state cookie. openssl rand -base64 48
      secret: ${JWT_SECRET:}
      access-token-ttl: 15m
      refresh-token-ttl: 14d
    refresh-cookie:
      name: refresh_token
      path: /api/auth
      secure: true
      same-site: Strict
    password:
      bcrypt-strength: 12
      # Reject passwords found in known breaches (Have I Been Pwned k-anonymity API; only 5 hash chars are sent)
      check-breached: ${PASSWORD_CHECK_BREACHED:true}
      max-failed-attempts: 5
      lockout-duration: 15m
    otp:
      length: 6
      ttl: 10m
      max-attempts: 5
      resend-cooldown: 60s
    oauth2:
      auto-register: true
      # Where the browser lands after social login; {host} is replaced by the tenant host
      frontend-callback: https://{host}/auth/callback
      # Set to ".example.com" when using one central OAuth2 callback host (see README)
      cookie-domain: ${OAUTH2_COOKIE_DOMAIN:}

  # Plans referenced by public.tenants.plan. max-users: -1 = unlimited. Unknown plan names are unlimited.
  plans:
    free:
      max-users: 5
    pro:
      max-users: 50
      features: [api-keys]
    enterprise:
      max-users: -1
      features: [api-keys, sso]

  rate-limit:
    auth:                          # POST /api/auth/** per tenant + client IP (in-memory, per node)
      enabled: true
      capacity: 30
      window: 1m

  bootstrap:
    super-admin-email: ${SUPER_ADMIN_EMAIL:}
    super-admin-password: ${SUPER_ADMIN_PASSWORD:}

  mail:
    from: ${MAIL_FROM:no-reply@example.com}
    product-name: ${APP_PRODUCT_NAME:Boilerplate}

  cors:
    # Only needed if the SPA is NOT served from the same origin (nginx makes it same-origin)
    allowed-origin-patterns: ${CORS_ORIGINS:https://*.example.com}

---
spring:
  config:
    activate:
      on-profile: dev
  thymeleaf:
    cache: false

server:
  error:
    include-message: always

app:
  tenancy:
    base-domain: localhost         # acme.localhost:3000 resolves to 127.0.0.1 in modern browsers
    platform-domain: admin.localhost
    dev-header-fallback: true
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    refresh-cookie:
      secure: false
    password:
      check-breached: false          # keep local sign-ups offline-friendly
    oauth2:
      frontend-callback: http://{host}:3000/auth/callback
  bootstrap:
    super-admin-email: ${SUPER_ADMIN_EMAIL:superadmin@admin.localhost}
    super-admin-password: ${SUPER_ADMIN_PASSWORD:ChangeMe!123}
  cors:
    allowed-origin-patterns: http://*.localhost:3000,http://localhost:3000

logging:
  level:
    com.polygis: DEBUG
