<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* Reusable e-mail shell: th:replace="~{fragments/email-layout :: layout(~{::content})}" */-->
<table th:fragment="layout(content)" role="presentation" width="100%" cellpadding="0" cellspacing="0"
       style="background:#f4f5f7;padding:32px 0;font-family:Arial,Helvetica,sans-serif;">
    <tr>
        <td align="center">
            <table role="presentation" width="560" cellpadding="0" cellspacing="0"
                   style="background:#ffffff;border-radius:8px;padding:32px;color:#1f2937;">
                <tr>
                    <td style="font-size:20px;font-weight:bold;padding-bottom:16px;" th:text="${productName}">Product</td>
                </tr>
                <tr>
                    <td th:replace="${content}">content</td>
                </tr>
                <tr>
                    <td style="padding-top:24px;font-size:12px;color:#6b7280;">
                        You received this e-mail because of activity on your account. If this wasn't you, ignore it.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
