<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="margin:0;">
<table th:replace="~{fragments/email-layout :: layout(~{::td.content})}">
    <tr>
        <td class="content" style="font-size:15px;line-height:1.6;">
            <p>Welcome, <span th:text="${name}">friend</span>!</p>
            <p>Your account is ready. Sign in any time at
                <a th:href="|https://${tenantHost}|" th:text="${tenantHost}">acme.example.com</a>.</p>
        </td>
    </tr>
</table>
</body>
</html>
