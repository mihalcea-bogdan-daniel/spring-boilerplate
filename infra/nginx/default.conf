# One server block serves every tenant:
#   https://<slug>.example.com      -> tenant <slug>
#   https://admin.example.com       -> platform tenant (super-admins)
#   https://portal.customer.com     -> tenant with a custom domain (default_server catches it)
# The tenant is NOT decided here: nginx only forwards the original Host and Spring resolves it.
# Wildcard TLS needs a DNS-01 challenge, e.g. certbot --dns-<provider> -d example.com -d '*.example.com'.

# Edge rate limit for the auth endpoints (shared across backend nodes, unlike the in-app limiter)
limit_req_zone $binary_remote_addr$host zone=auth:10m rate=30r/m;

upstream spring_backend { server backend:8080; keepalive 32; }
upstream nuxt_frontend  { server frontend:3000; keepalive 32; }

server {
    listen 80 default_server;
    server_name .example.com .localhost _;

    client_max_body_size 20m;

    # Always overwrite forwarding headers so clients cannot spoof the tenant host.
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # REST API, OAuth2 entry (/api/oauth2/authorization/*) and callback (/api/login/oauth2/code/*), Swagger.
    # X-Tenant-ID passes through untouched; the backend only honours it for platform super-admins.
    location /api/ {
        proxy_pass http://spring_backend;
    }

    location /api/auth/ {
        limit_req zone=auth burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://spring_backend;
    }

    # Server-rendered Thymeleaf pages that live in Spring
    location = /oauth2/error { proxy_pass http://spring_backend; }
    location = /status       { proxy_pass http://spring_backend; }
    location /css/           { proxy_pass http://spring_backend; }

    # Health probes should normally be internal only
    location /actuator/ { deny all; }

    # Everything else is the Nuxt app (SSR + assets)
    location / {
        proxy_pass http://nuxt_frontend;
    }
}
