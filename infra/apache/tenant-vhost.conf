# Apache 2.4 equivalent of infra/nginx/default.conf
# a2enmod proxy proxy_http headers ssl
<VirtualHost *:443>
    ServerName example.com
    ServerAlias *.example.com
    # ServerAlias portal.customer.com    # custom tenant domains

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/example.com/privkey.pem

    ProxyPreserveHost On          # Spring needs the original Host to resolve the tenant
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host  "%{HTTP_HOST}s"

    ProxyPass        /api/          http://127.0.0.1:8080/api/
    ProxyPassReverse /api/          http://127.0.0.1:8080/api/
    ProxyPass        /oauth2/error  http://127.0.0.1:8080/oauth2/error
    ProxyPass        /status        http://127.0.0.1:8080/status
    ProxyPass        /css/          http://127.0.0.1:8080/css/

    <Location /actuator>
        Require all denied
    </Location>

    ProxyPass        /  http://127.0.0.1:3000/
    ProxyPassReverse /  http://127.0.0.1:3000/
</VirtualHost>
