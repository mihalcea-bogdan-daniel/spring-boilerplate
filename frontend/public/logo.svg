<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="front"><rect x="0" y="256" width="512" height="256"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="#171817"/>
  <!-- back half of the orbit, hidden behind the hexagon -->
  <ellipse cx="256" cy="256" rx="196" ry="74" transform="rotate(-28 256 256)" fill="none" stroke="#dc7e3d" stroke-width="20"/>
  <polygon points="256,132 363,194 363,318 256,380 149,318 149,194" fill="none" stroke="#d9dadb" stroke-width="26" stroke-linejoin="round"/>
  <!-- front half, with a dark gap so it reads as passing in front -->
  <g transform="rotate(-28 256 256)" clip-path="url(#front)">
    <ellipse cx="256" cy="256" rx="196" ry="74" fill="none" stroke="#171817" stroke-width="40"/>
    <ellipse cx="256" cy="256" rx="196" ry="74" fill="none" stroke="#dc7e3d" stroke-width="20"/>
  </g>
  <circle cx="427" cy="209" r="32" fill="#dc7e3d" stroke="#171817" stroke-width="12"/>
</svg>
